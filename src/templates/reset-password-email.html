<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Скидання пароля</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f7;
      font-family: Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f4f7; padding: 40px 0"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="
              background-color: #ffffff;
              border-radius: 8px;
              padding: 32px;
            "
          >
            <tr>
              <td>
                <h2 style="color: #1a1a1a; margin-top: 0">
                  Привіт, {{username}}!
                </h2>
                <p style="color: #444444; font-size: 15px; line-height: 1.5">
                  Ми отримали запит на скидання пароля для вашого акаунта.
                  Якщо це були ви — натисніть кнопку нижче, щоб встановити
                  новий пароль. Посилання дійсне протягом 15 хвилин.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      style="
                        background-color: #4f46e5;
                        border-radius: 6px;
                        padding: 12px 24px;
                      "
                    >
                      <a
                        href="{{{resetLink}}}"
                        style="
                          color: #ffffff;
                          text-decoration: none;
                          font-size: 15px;
                          font-weight: bold;
                        "
                        >Скинути пароль</a
                      >
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    color: #888888;
                    font-size: 13px;
                    margin-top: 24px;
                    line-height: 1.5;
                  "
                >
                  Якщо ви не надсилали цей запит — просто проігноруйте цей
                  лист, ваш пароль залишиться без змін.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
